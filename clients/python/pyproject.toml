[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amenolink"
version = "0.1.0"
description = "Cliente AmenoLink para Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-ulid>=4.0.1",
    "signalrcore>=1.0.2",
    "msgpack>=1.1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["amenolink"]
