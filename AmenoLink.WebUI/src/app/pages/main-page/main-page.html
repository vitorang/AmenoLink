<div class="page-container">
    <div class="tab-header-bar">
        <mat-tab-group
            class="compact-tabs"
            animationDuration="0ms"
            [fitInkBarToContent]="true"
            [(selectedIndex)]="activeTabIndex"
        >
            <mat-tab label="Geral">
                <div class="tab-content">
                    <app-general-tab />
                </div>
            </mat-tab>
            <mat-tab label="Programas">
                <div class="tab-content">
                    <app-programs-tab />
                </div>
            </mat-tab>
            <mat-tab label="Caches">
                <div class="tab-content">
                    <app-caches-tab />
                </div>
            </mat-tab>
            <mat-tab label="Tópicos">
                <div class="tab-content">
                    <app-topics-tab />
                </div>
            </mat-tab>
        </mat-tab-group>

        <div class="tab-actions">
            <button
                mat-icon-button
                [color]="isCurrentTabModified ? 'primary' : null"
                [disabled]="!isCurrentTabModified"
                (click)="onUndo()"
                matTooltip="Desfazer alterações"
            >
                <mat-icon>undo</mat-icon>
            </button>
            <button
                mat-icon-button
                [color]="isCurrentTabModified ? 'primary' : null"
                [disabled]="!isCurrentTabModified"
                (click)="onSave()"
                matTooltip="Salvar alterações"
            >
                <mat-icon>save</mat-icon>
            </button>
        </div>
    </div>
</div>
