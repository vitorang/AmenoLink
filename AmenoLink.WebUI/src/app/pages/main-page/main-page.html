<div class="page-container">
    <div class="tab-header-bar">
        <mat-tab-group
            class="compact-tabs"
            animationDuration="0ms"
            [fitInkBarToContent]="true"
            [(selectedIndex)]="activeTabIndex"
        >
            <mat-tab label="Geral">
                <div class="tab-content">
                    <app-general-tab />
                </div>
            </mat-tab>
            <mat-tab label="Programas">
                <div class="tab-content">
                    <app-programs-tab />
                </div>
            </mat-tab>
            <mat-tab label="Caches">
                <div class="tab-content">
                    <app-caches-tab />
                </div>
            </mat-tab>
            <mat-tab label="Tópicos">
                <div class="tab-content">
                    <app-topics-tab />
                </div>
            </mat-tab>
            <mat-tab label="Estados">
                <div class="tab-content">
                    <app-stores-tab />
                </div>
            </mat-tab>
        </mat-tab-group>

        @if (isCurrentTabModified) {
            <div class="tab-actions">
                <button mat-icon-button color="primary" (click)="onUndo()" title="Desfazer alterações">
                    <mat-icon>undo</mat-icon>
                </button>
                <button mat-icon-button color="primary" (click)="onSave()" title="Salvar alterações">
                    <mat-icon>save</mat-icon>
                </button>
            </div>
        }
    </div>
</div>
