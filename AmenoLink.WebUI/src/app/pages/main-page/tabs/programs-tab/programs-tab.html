<div class="programs-tab-container">
    <div class="left-column">
        <app-group-manager
            [items]="programItems()"
            [selectedId]="programsService.selectedProgram()?.id ?? null"
            itemIcon="terminal"
            badgeIcon="bolt"
            emptyText="Nenhum programa cadastrado."
            (add)="onAdd()"
            (remove)="onRemove($event)"
            (select)="onSelect($event)"
        />
    </div>

    <div class="right-column">
        @if (programsService.selectedProgram(); as selected) {
            <app-program-details
                [program]="selected"
                (programChange)="programsService.updateSelectedProgram($event)"
            />
        } @else {
            <div class="no-selection-state">
                <mat-icon class="no-selection-icon">mouse</mat-icon>
                <span>Selecione ou adicione um programa para ver os detalhes.</span>
            </div>
        }
    </div>
</div>
