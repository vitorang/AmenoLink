<div class="tab-layout-container">
    <div class="left-column">
        <app-group-manager
            [items]="programItems()"
            [selectedId]="programsService.selectedProgram()?.id ?? null"
            badgeIcon="bolt"
            emptyText="Nenhum programa cadastrado."
            (add)="onAdd()"
            (remove)="onRemove($event)"
            (select)="onSelect($event)"
        />
    </div>

    <div class="right-column">
        @if (programsService.selectedProgram(); as selected) {
            <app-program-details
                [program]="selected"
                (programChange)="programsService.updateSelectedProgram($event)"
            />
        } @else {
            <app-empty-state
                icon="mouse"
                message="Selecione ou adicione um programa para ver os detalhes."
            />
        }
    </div>
</div>
