<div class="program-details-container">
    <div class="details-header">
        <mat-icon class="header-icon">terminal</mat-icon>
        <div class="header-titles">
            <h2 class="program-title">{{ programName }}</h2>
            <span class="program-path">{{ program().path }}</span>
        </div>
        <button mat-icon-button (click)="onChangeExecutable()" title="Alterar executável">
            <mat-icon>folder_open</mat-icon>
        </button>
    </div>

    <div class="section-title">Configurações Gerais</div>
    <div class="fields-grid">
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-label>Máximo de Instâncias</mat-label>
            <input
                matInput
                type="number"
                min="1"
                step="1"
                [ngModel]="program().maxInstances"
                (ngModelChange)="onMaxInstancesChange($event)"
                (blur)="onBlur($event)"
            />
            <mat-icon matSuffix>stack</mat-icon>
        </mat-form-field>
    </div>

    <div class="section-title">Limite de Tempo</div>
    <div class="fields-grid">
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-label>Inicialização</mat-label>
            <input
                matInput
                type="number"
                min="1"
                step="1"
                [ngModel]="program().startupTimeoutInSeconds"
                (ngModelChange)="onStartupTimeoutChange($event)"
                (blur)="onBlur($event)"
            />
            <mat-icon matSuffix>timer</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-label>Inatividade</mat-label>
            <input
                matInput
                type="number"
                min="1"
                step="1"
                [ngModel]="program().slidingExpirationInSeconds"
                (ngModelChange)="onSlidingExpirationChange($event)"
                (blur)="onBlur($event)"
            />
            <mat-icon matSuffix>timer</mat-icon>
        </mat-form-field>
    </div>

    <div class="time-note">
        <mat-icon class="note-icon">info</mat-icon>
        <span>Tempo em segundos</span>
    </div>
</div>

<div class="program-details-container">
    <div class="section-header">
        <div class="section-title">
            <mat-icon class="section-icon">bolt</mat-icon>
            Ações
        </div>
        <button mat-stroked-button (click)="onAddHandler()">
            <mat-icon>add</mat-icon>
            Adicionar Ação
        </button>
    </div>

    <div class="handlers-list">
        @for (handler of program().handlers; track $index) {
            <app-handler-entry
                [handler]="handler"
                (click)="onEditHandler($index)"
                (remove)="onRemoveHandler($index)"
            />
        } @empty {
            <div class="empty-handlers">Nenhuma ação cadastrada para este programa.</div>
        }
    </div>
</div>
