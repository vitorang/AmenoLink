<div class="details-card">
    <div class="details-header">
        <mat-icon class="header-icon">campaign</mat-icon>
        <div class="header-titles">
            <h2 class="details-title">{{ config().name }}</h2>
            <span class="details-subtitle">Tópico</span>
        </div>
    </div>
</div>

<div class="details-card">
    <div class="section-header">
        <div class="section-title">Inscrições</div>
        <button mat-stroked-button (click)="onRefreshSubscribers()" [disabled]="loadingSubscribers()">
            <mat-icon>refresh</mat-icon>
            Atualizar
        </button>
    </div>

    @if (subscribers() === null) {
        <div class="empty-values">Clique em "Atualizar" para carregar as inscrições.</div>
    } @else if (subscribers()!.length === 0) {
        <div class="empty-values">Nenhuma inscrição neste tópico.</div>
    } @else {
        <div class="table-container">
            <table mat-table [dataSource]="subscribers()!" class="values-table">
                <ng-container matColumnDef="appName">
                    <th mat-header-cell *matHeaderCellDef>Aplicação</th>
                    <td mat-cell *matCellDef="let element" class="key-cell">{{ element.appName }}</td>
                </ng-container>

                <ng-container matColumnDef="connectionId">
                    <th mat-header-cell *matHeaderCellDef>ID de Conexão</th>
                    <td mat-cell *matCellDef="let element" class="value-cell">{{ element.connectionId }}</td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
            </table>
        </div>
    }
</div>
