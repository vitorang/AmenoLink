<div class="details-card">
    <div class="details-header">
        <mat-icon class="header-icon">settings</mat-icon>
        <div class="header-titles">
            <h2 class="details-title">Geral</h2>
            <span class="details-subtitle">Configurações globais</span>
        </div>
    </div>

    <div class="section-title">Comportamento</div>
    <div class="setting-item" (click)="onToggleStartMinimizedToTray()">
        <div class="setting-info">
            <span class="setting-title">Minimizar ao iniciar</span>
            <span class="setting-description">Inicia a aplicação ocultada na bandeja do sistema (Tray)</span>
        </div>
        <mat-slide-toggle [ngModel]="generalService.generalConfig().startMinimizedToTray"
            (ngModelChange)="onStartMinimizedToTrayChange($event)" color="primary" (click)="$event.stopPropagation()">
        </mat-slide-toggle>
    </div>

    <div class="section-title">Limitação de Mensageria</div>
    <div class="fields-grid">
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-label>Mensagens Encadeadas</mat-label>
            <input matInput type="number" min="1" step="1" [ngModel]="generalService.generalConfig().maxMessageDepth"
                (ngModelChange)="onMaxMessageDepthChange($event)" (blur)="onMaxMessageDepthBlur($event)" />
            <mat-icon matSuffix>unfold_more</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-label>Histórico por tópico</mat-label>
            <input matInput type="number" min="1" step="1"
                [ngModel]="generalService.generalConfig().maxTopicHistorySize"
                (ngModelChange)="onMaxTopicHistorySizeChange($event)" (blur)="onMaxTopicHistorySizeBlur($event)" />
            <mat-icon matSuffix>history</mat-icon>
        </mat-form-field>
    </div>
</div>
